name: Build Warung Scan APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

concurrency:
  group: warung-scan-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Pasang Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Siapkan Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bangun APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Siapkan file unduhan
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Warung-Scan.apk
          sha256sum dist/Warung-Scan.apk > dist/Warung-Scan.apk.sha256

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: Warung-Scan-APK-${{ github.run_number }}
          path: |
            dist/Warung-Scan.apk
            dist/Warung-Scan.apk.sha256
          retention-days: 30

      - name: Terbitkan APK ke GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="warung-scan-build-${GITHUB_RUN_NUMBER}"
          release_notes="APK uji Warung Scan untuk Android. Mendukung galeri, kamera, backup file, dan printer Bluetooth Classic RPP02N."
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" dist/Warung-Scan.apk dist/Warung-Scan.apk.sha256 --clobber
          else
            gh release create "$release_tag" \
              dist/Warung-Scan.apk \
              dist/Warung-Scan.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "Warung Scan APK build ${GITHUB_RUN_NUMBER}" \
              --notes "$release_notes" \
              --latest
          fi
