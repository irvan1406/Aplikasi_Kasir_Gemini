plugins {
    id 'com.android.application'
}

android {
    namespace 'com.warungscan.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.warungscan.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            assets.srcDir "$buildDir/generated/webAssets"
        }
    }
}

tasks.register('syncWebAssets', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html'
        include 'style.css'
        include 'app.js'
        include 'database.js'
        include 'printer-bluetooth.js'
        include 'vendor/**'
    }
    into "$buildDir/generated/webAssets/www"
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('syncWebAssets')
}
